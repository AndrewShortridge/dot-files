# ~/.config/kitty/keyd/default.conf  ->  /etc/keyd/default.conf
# Source of truth lives in this repo; keyd/install.sh copies it into place.
#
# Physical layer: dual-role home-row modifiers for a vim-style COSMIC + kitty
# workflow. hjkl is always a direction; the held key picks the scope.
#
#   key        tap     hold
#   ---------  ------  --------------------------------------------
#   capslock   esc     Super layer  -> COSMIC window/workspace actions
#   tab        tab     Alt layer    -> kitty pane actions
#   enter      enter   Ctrl (single-hold Ctrl for the right hand)
#   space      space   Ctrl ONLY while capslock or tab is already held
#
# Panic exit if a bad config wedges the keyboard: backspace+esc+enter.
# Reload after editing: sudo keyd reload   (errors: journalctl -u keyd -e)

[ids]
*

[global]
# Tap behaviour (esc/tab) is suppressed if the key was held longer than this.
# Prevents a stray esc/tab when you hold caps/tab, change your mind, release.
overload_tap_timeout = 400

[main]
capslock = overload(caps, esc)
tab = overload(tabl, tab)
# Single-hold Ctrl for the right hand: enter+c = Ctrl+C, enter+hjkl = Ctrl+hjkl.
# Costs enter key-repeat only. Falls through into caps/tabl layers, so
# caps+enter still taps Super+Enter (kitty) and caps+space+enter is Ctrl+Enter.
enter = overload(control, enter)

# ---------------------------------------------------------------------------
# caps:M  -- hold capslock = Super. Nothing else needs listing: every key not
# bound here is emitted as Super+<key>, so COSMIC's defaults apply unchanged
# (caps+hjkl focus, caps+shift+hjkl move, caps+1..9 workspace, caps+q close,
# caps+m maximize, caps+enter kitty, ...). Physical shift/alt stack normally.
# ---------------------------------------------------------------------------
[caps:M]
# hold: Ctrl layer (see [caps+control]); tap: Super+space -> COSMIC launcher
space = overload(control, M-space)

# ---------------------------------------------------------------------------
# tabl:A  -- hold tab = Alt. Every key not bound here is emitted as Alt+<key>;
# kitty.conf binds alt+hjkl / alt+shift+hjkl / alt+\ / alt+- / alt+x / alt+z /
# alt+[ / alt+] for pane and tab actions.
# ---------------------------------------------------------------------------
[tabl:A]
# hold: Ctrl layer (see [tabl+control]); tap: Alt+space -> COSMIC launcher
space = overload(control, A-space)

# ---------------------------------------------------------------------------
# Composite layers: active while caps/tab AND space are held. An explicit
# binding on a composite layer ignores the constituents' modifiers, so these
# emit PLAIN Ctrl+<key> (not Super+Ctrl / Alt+Ctrl). Physical shift still
# stacks: caps+space+shift+h -> Ctrl+Shift+h.
# Keys not listed below fall through to Super+Ctrl+<key> / Alt+Ctrl+<key>.
# ---------------------------------------------------------------------------
[caps+control]
a = C-a
b = C-b
c = C-c
d = C-d
