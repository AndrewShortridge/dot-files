# ~/.config/kitty/keyd/default.conf  ->  /etc/keyd/default.conf
# Source of truth lives in this repo; keyd/install.sh copies it into place.
#
# Home-row modifiers, mirrored on both hands (pinky -> index finger):
#
#   left   a      s    d      f
#   right  ;      l    k      j
#   hold   Super  Alt  Shift  Ctrl
#
# Tap = the letter. Use the OPPOSITE hand's mod for a chord: a+hjkl = Super+hjkl
# (COSMIC), s+hjkl = Alt+hjkl (kitty panes), j+c = Ctrl+C. Stack mods by holding
# several: a+d+h = Super+Shift+h.
#
# lettermod(<mod>, <key>, 150, 200): the key is always a letter if struck within
# 150 ms of the previous letter (normal typing), otherwise it becomes the mod
# when held 200 ms or when another key is tapped while it is down.
#
# Navigation layers, held from the bottom row; the nav keys sit on the OTHER
# hand, finger-for-finger mirrored like the mods:
#
#   hold v (nav_r)   h     j     k   l      u       i     o    p
#   hold n (nav_l)   g     f     d   s      r       e     w    q
#   emits            Left  Down  Up  Right  PageUp  Home  End  PageDown
#
# Keys a nav layer does not bind fall through to [main], so the holding hand's
# home-row mods still stack: v+d+h = Shift+Left, n+k+g = Shift+Left. Shift is
# rebound to a plain layer(shift) inside each nav layer: as a lettermod it would
# type its letter when pressed within 150 ms of an arrow (select right after
# moving).
#
# Numbers and symbols, held with the left hand; the keys sit on the right hand:
#
#   key              y u i o p     h j k l ;     n m , . /
#   hold c (num_r)   * 7 8 9 +     . 4 5 6 -     0 1 2 3 /
#   hold x (sym_r)   ~ _ { } $     = ( ) " :     # - , . /
#   hold x + d       ` ^ [ ] %     + & * ' !     | \ < > ?
#
# num_r emits plain digits, not keypad codes, so the left hand's mods stack:
# c+a+m = Super+1, c+s+j = Alt+4. c sits under the Shift finger, so num_r has no
# Shift. In sym_r, d is a plain Shift and [sym_r+shift] is the second tier.
# sym_r leaves , . / unbound so pairs like ", ), ): and ~/ need no release.
#
# Panic exit if a bad config wedges the keyboard: backspace+esc+enter.
# Reload after editing: sudo keyd reload   (errors: journalctl -u keyd -e)

[ids]
*

[main]
capslock = esc

a = lettermod(meta, a, 150, 200)
s = lettermod(alt, s, 150, 200)
d = lettermod(shift, d, 150, 200)
f = lettermod(control, f, 150, 200)

semicolon = lettermod(meta, semicolon, 150, 200)
l = lettermod(alt, l, 150, 200)
k = lettermod(shift, k, 150, 200)
j = lettermod(control, j, 150, 200)

v = lettermod(nav_r, v, 150, 200)
n = lettermod(nav_l, n, 150, 200)
c = lettermod(num_r, c, 150, 200)
x = lettermod(sym_r, x, 150, 200)

[nav_r]
d = layer(shift)
h = left
j = down
k = up
l = right
u = pageup
i = home
o = end
p = pagedown

[nav_l]
k = layer(shift)
g = left
f = down
d = up
s = right
r = pageup
e = home
w = end
q = pagedown

[num_r]
y = *
u = 7
i = 8
o = 9
p = +
h = dot
j = 4
k = 5
l = 6
semicolon = minus
n = 0
m = 1
comma = 2
dot = 3

[sym_r]
d = layer(shift)
y = ~
u = _
i = {
o = }
p = $
h = equal
j = (
k = )
l = "
semicolon = :
n = #
m = minus

[sym_r+shift]
y = grave
u = ^
i = leftbrace
o = rightbrace
p = %
h = +
j = &
k = *
l = apostrophe
semicolon = !
n = |
m = backslash
