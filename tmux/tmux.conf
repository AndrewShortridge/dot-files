# ~/.config/tmux/tmux.conf
#
# Mirrors ~/.config/kitty/kitty.conf: One Dark palette (current-theme.conf) and
# the tab bar (tab_bar_style powerline, tab_powerline_style round,
# tab_title_template "{index}: <cwd basename>") with the colours set at the
# bottom of kitty.conf.

# ---------------------------------------------------------------------------
# Palette (kitty current-theme.conf + kitty.conf overrides)
# ---------------------------------------------------------------------------
%hidden FG='#979eab'            # foreground
%hidden BG='#282c34'            # background
%hidden BRIGHT='#abb2bf'        # color15
%hidden SURFACE='#393e48'       # color8 / inactive_border_color
%hidden ACCENT='#61afef'        # cursor / active_border_color
%hidden RED='#e06c75'           # color1 (kitty bell symbol colour)
%hidden GREEN='#98c379'         # color2
%hidden MAGENTA='#c678dd'       # color5: the ksession pickers' `*` current-session marker
                                # reaches it via ANSI-16 (bold 35), not via this variable
%hidden ACTIVE_FG='#282c34'     # active_tab_foreground
%hidden ACTIVE_BG='#56b6c2'     # active_tab_background
%hidden INACTIVE_FG='#7f848e'   # inactive_tab_foreground
%hidden INACTIVE_BG='#16191f'   # inactive_tab_background
%hidden BAR_BG='#101217'        # tab_bar_background
%hidden ZOOM_FG='#5a0f2e'       # kitty active_tab_title_template zoom marker colour

# ---------------------------------------------------------------------------
# Prefix: C-a (C-a C-a sends a literal C-a to the pane)
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Terminal: true colour so the hex palette above actually renders
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:usstyle:hyperlinks"

# ---------------------------------------------------------------------------
# Windows numbered 1.. and kept contiguous, like kitty's {index}.
# renumber-windows is required: the tab separator logic below assumes the
# next window's index is #I+1.
# ---------------------------------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------------------
# Pane borders. Inactive = kitty inactive_border_color; the active pane gets
# OneDark green, heavy lines. tmux only draws borders *between* panes: the
# outer edges of the window have no border, so an edge pane is outlined on
# the sides that touch another pane.
# ---------------------------------------------------------------------------
set -g pane-border-lines heavy
set -g pane-border-style "fg=$SURFACE"
set -g pane-active-border-style "fg=$GREEN"

# Inactive panes get a slightly darker background so the active split stands
# out on all four sides (the border alone can't outline window-edge panes).
%hidden DIM_BG='#21252b'
set -g window-style "bg=$DIM_BG"
set -g window-active-style "bg=$BG"

# Command prompt / messages / copy-mode / clock
set -g message-style "fg=$BRIGHT,bg=$SURFACE"
set -g message-command-style "fg=$BRIGHT,bg=$SURFACE"
set -g mode-style "reverse"                      # kitty default selection is reverse video
set -g copy-mode-match-style "fg=$BG,bg=$ACCENT"
set -g copy-mode-current-match-style "fg=$BG,bg=$ACTIVE_BG"
set -g clock-mode-colour "$ACCENT"

# Popups (ksession pickers on prefix s / S / f): same surface as messages
set -g popup-style "bg=$BG,fg=$FG"
set -g popup-border-style "fg=$SURFACE"
set -g popup-border-lines rounded

# ---------------------------------------------------------------------------
# Status bar = kitty tab bar
#   tab_bar_edge bottom, tab_bar_align start, tab_bar_min_tabs 1
#   nothing visible on the left or right; just the tabs (status-right only
#   carries the silent ksession autosave tick, see below)
# ---------------------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 2                          # cwd-based titles need polling
set -g status-style "fg=$INACTIVE_FG,bg=$BAR_BG"
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 0

# ---------------------------------------------------------------------------
# ksession autosave (~/.local/bin/ksession tmux autosave)
# Snapshots every session when a client detaches, and periodically while
# attached: status-right is re-evaluated every status-interval, so its #()
# is the timer. `ksession tmux autosave` throttles itself (15m stamp file)
# and prints nothing, so the right side of the bar stays visually empty.
# Requires `make install` in ~/.config/kitty/scripts/ksession-rs; the tick
# is a no-op (and the pickers fail) until the installed binary has `tmux`.
# ---------------------------------------------------------------------------
set-hook -g client-detached 'run-shell -b "~/.local/bin/ksession tmux autosave --force >/dev/null 2>&1"'
set -g status-right '#(~/.local/bin/ksession tmux autosave >/dev/null 2>&1)'

# Powerline-round layout, exactly as kitty's draw_tab_with_powerline:
#   " 1: foo " + U+E0B4 (fg=tab bg, bg=next tab bg)
#   two adjacent inactive tabs share a bg, so kitty draws a soft U+E0B5 in
#   the bar colour instead of a hard separator.
%hidden SEP=''
%hidden SOFT_SEP=''

# Title: "{index}: {bell}{cwd basename}"  (bell in red, like kitty's
# {fmt.fg.red}{bell_symbol})
%hidden TITLE_INACTIVE="#I: #{?window_bell_flag,#[fg=$RED]🔔 #[fg=$INACTIVE_FG],}#{b:pane_current_path}"
# Active tab only, like kitty's active_tab_title_template: when the pane is
# zoomed (other panes hidden) append " ⧉N", N = panes in the window, in
# maroon (#5a0f2e, ~5.8:1 on the cyan active background).
%hidden TITLE_ACTIVE="#I: #{?window_bell_flag,#[fg=$RED]🔔 #[fg=$ACTIVE_FG],}#{b:pane_current_path}#{?window_zoomed_flag,#[fg=$ZOOM_FG] ⧉#{window_panes}#[fg=$ACTIVE_FG],}"

set -g window-status-separator ""

# Inactive tab: separator depends on what follows.
#   last window         -> hard sep onto the bar background
#   next window active  -> hard sep onto the active background
#   otherwise           -> soft sep (bar colour on inactive background)
set -g window-status-style "fg=$INACTIVE_FG,bg=$INACTIVE_BG"
set -g window-status-format "#[fg=$INACTIVE_FG,bg=$INACTIVE_BG] $TITLE_INACTIVE #{?window_end_flag,#[fg=$INACTIVE_BG#,bg=$BAR_BG]$SEP,#{?#{==:#{e|+:#I,1},#{active_window_index}},#[fg=$INACTIVE_BG#,bg=$ACTIVE_BG]$SEP,#[fg=$BAR_BG#,bg=$INACTIVE_BG]$SOFT_SEP}}"

# Active tab: bold (active_tab_font_style bold); separator onto the next
# inactive tab, or the bar background if it is the last window.
set -g window-status-current-style "fg=$ACTIVE_FG,bg=$ACTIVE_BG,bold"
set -g window-status-current-format "#[fg=$ACTIVE_FG,bg=$ACTIVE_BG,bold] $TITLE_ACTIVE #[nobold]#{?window_end_flag,#[fg=$ACTIVE_BG#,bg=$BAR_BG],#[fg=$ACTIVE_BG#,bg=$INACTIVE_BG]}$SEP"

# Bell/activity colouring is handled inside the formats above; stop tmux from
# layering its default reverse-video styles on top.
set -g window-status-bell-style default
set -g window-status-activity-style default
set -g window-status-last-style default

# ===========================================================================
# Keybindings: vim-style, mirroring kitty (KEYBINDS.md) and nvim.
#   prefix (C-a) chords  = kitty's ctrl+space leader
#   bare C-h/j/k/l       = vim-tmux-navigator (nvim <C-h/j/k/l>)
#   Alt layer            = kitty's held-Tab layer (only reaches tmux in
#                          terminals that don't claim Alt+key themselves)
#   C-M-h/j/k/l          = kitty's resize keys
# ===========================================================================
set -g mode-keys vi
set -g status-keys emacs                 # command prompt stays readline-like
set -s escape-time 10                    # don't make <Esc> in nvim wait
set -g focus-events on                   # nvim autoread / FocusGained
set -s set-clipboard on                  # copy-mode yank -> system clipboard via OSC 52

# Config reload (kitty: ctrl+shift+f5)
bind C-r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---- Splits / panes: leader | - c h j k l H J K L m w e r -------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c confirm-before -p "close pane #P? (y/n)" kill-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'
bind m resize-pane -Z                    # kitty toggle stack / nvim <leader>sm
bind w display-panes                     # kitty focus_visible_window
bind e select-layout -E                  # nvim <leader>se equalize
bind o rotate-window                     # kitty ctrl+shift+r rotate

# Resize mode (kitty leader r): hjkl nudge until Enter/Esc/q
bind r switch-client -T resize \; display "resize: h/j/k/l, Enter/Esc to finish"
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize 0 select-layout -E \; switch-client -T resize
bind -T resize Enter switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize q switch-client -T root

# ---- Windows (= kitty tabs): leader t x n p N P , 1-9 0 -------------------
bind t new-window -c "#{pane_current_path}"
bind x confirm-before -p "close window #I:#W? (y/n)" kill-window
bind n next-window
bind p previous-window
bind N swap-window -d -t +1
bind P swap-window -d -t -1
bind R command-prompt -I "#W" { rename-window "%%" }   # kitty leader R
bind 0 last-window                        # kitty alt+0 = last visited tab
bind Tab last-window

# ---- Scrollback / pickers: leader / ? s S f -------------------------------
bind / copy-mode                          # kitty leader /  (scrollback)
bind ? list-keys -T prefix                # kitty leader ?  (command palette)
# ksession pickers in a popup (~/.config/tmux/scripts/, kitty ctrl+space>s/S/f).
# Pickers are modal: type to filter; Esc -> normal mode (j/k move, Enter
# open, d kill session / remove saved session, i back to insert, q quit).
bind s display-popup -E -w 90% -h 85% -T ' sessions ' ~/.config/tmux/scripts/ksession-picker.sh           # kitty leader s  (session picker)
bind S display-popup -E -w 70% -h 60% -T ' save session ' ~/.config/tmux/scripts/ksession-save-prompt.sh  # kitty leader S  (save session)
bind f display-popup -E -w 90% -h 85% -T ' panes ' ~/.config/tmux/scripts/ksession-picker.sh --panes      # kitty leader f  (tab/split picker)

# ---- Which-key: leader Space -> native display-menu, no plugin ------------
# Each menu is a command alias so menus can link to each other (back with
# BSpace, resize is transient and re-opens itself). Item keys are the real
# prefix keys from the sections above, so the menu doubles as a cheat sheet;
# group keys (p/w/s/r) only exist inside the menu. Esc or q closes.
# display-menu is drawn by the tmux server itself (no fork, ~2 ms over the
# client round-trip), which is why this isn't a popup + script.
set -g menu-style "fg=$FG,bg=$BG"
set -g menu-selected-style "fg=$ACTIVE_FG,bg=$ACTIVE_BG,bold"
set -g menu-border-style "fg=$SURFACE"
set -g menu-border-lines rounded
%hidden MENU='display-menu -x C -y S'

set -sa command-alias "wk-root=$MENU -T ' which-key ' \
  '+panes'                 p    'wk-panes' \
  '+windows'               w    'wk-windows' \
  '+sessions'              s    'wk-sessions' \
  '+resize'                r    'wk-resize' \
  ''                       ''   '' \
  'Scrollback (copy mode)' /    'copy-mode' \
  'List prefix keys'       ?    'list-keys -T prefix' \
  'Reload tmux.conf'       C-r  'source-file ~/.config/tmux/tmux.conf ; display \"tmux.conf reloaded\"'"

set -sa command-alias "wk-panes=$MENU -T ' panes ' \
  'Split right'            |    'split-window -h -c \"#{pane_current_path}\"' \
  'Split below'            -    'split-window -v -c \"#{pane_current_path}\"' \
  'Close pane'             c    'confirm-before -p \"close pane #P? (y/n)\" kill-pane' \
  ''                       ''   '' \
  'Focus left'             h    'select-pane -L' \
  'Focus down'             j    'select-pane -D' \
  'Focus up'               k    'select-pane -U' \
  'Focus right'            l    'select-pane -R' \
  'Pick pane by label'     w    'display-panes' \
  ''                       ''   '' \
  'Swap left'              H    'swap-pane -s {left-of}' \
  'Swap down'              J    'swap-pane -s {down-of}' \
  'Swap up'                K    'swap-pane -s {up-of}' \
  'Swap right'             L    'swap-pane -s {right-of}' \
  'Rotate panes'           o    'rotate-window' \
  ''                       ''   '' \
  'Zoom toggle'            m    'resize-pane -Z' \
  'Equalize'               e    'select-layout -E' \
  '+resize'                r    'wk-resize' \
  ''                       ''   '' \
  'Break to new window'    T    'break-pane' \
  'Send to window...'      X    'choose-tree -Zw { join-pane -t \"%%\" }' \
  ''                       ''   '' \
  'Back'                   BSpace 'wk-root'"

set -sa command-alias "wk-windows=$MENU -T ' windows ' \
  'New window'             t    'new-window -c \"#{pane_current_path}\"' \
  'Close window'           x    'confirm-before -p \"close window #I:#W? (y/n)\" kill-window' \
  'Rename window...'       R    'command-prompt -I \"#W\" { rename-window \"%%\" }' \
  ''                       ''   '' \
  'Next window'            n    'next-window' \
  'Previous window'        p    'previous-window' \
  'Last window'            0    'last-window' \
  'Move window right'      N    'swap-window -d -t +1' \
  'Move window left'       P    'swap-window -d -t -1' \
  ''                       ''   '' \
  'Pane picker'            f    'display-popup -E -w 90% -h 85% -T \" panes \" ~/.config/tmux/scripts/ksession-picker.sh --panes' \
  ''                       ''   '' \
  'Back'                   BSpace 'wk-root'"

set -sa command-alias "wk-sessions=$MENU -T ' sessions ' \
  'Session picker'         s    'display-popup -E -w 90% -h 85% -T \" sessions \" ~/.config/tmux/scripts/ksession-picker.sh' \
  'Save session...'        S    'display-popup -E -w 70% -h 60% -T \" save session \" ~/.config/tmux/scripts/ksession-save-prompt.sh' \
  'Pane picker'            f    'display-popup -E -w 90% -h 85% -T \" panes \" ~/.config/tmux/scripts/ksession-picker.sh --panes' \
  ''                       ''   '' \
  'New session...'         n    'command-prompt -p \"new session:\" { new-session -d -s \"%%\" ; switch-client -t \"%%\" }' \
  'Rename session...'      \$   'command-prompt -I \"#S\" { rename-session \"%%\" }' \
  'Next session'           )    'switch-client -n' \
  'Previous session'       (    'switch-client -p' \
  'Detach'                 d    'detach-client' \
  ''                       ''   '' \
  'Back'                   BSpace 'wk-root'"

# Transient: every item re-opens the menu, so h/j/k/l repeat until Esc/q.
set -sa command-alias "wk-resize=$MENU -T ' resize ' \
  'Left 5'                 h    'resize-pane -L 5 ; wk-resize' \
  'Down 3'                 j    'resize-pane -D 3 ; wk-resize' \
  'Up 3'                   k    'resize-pane -U 3 ; wk-resize' \
  'Right 5'                l    'resize-pane -R 5 ; wk-resize' \
  'Equalize'               0    'select-layout -E ; wk-resize' \
  'Zoom toggle'            m    'resize-pane -Z ; wk-resize' \
  ''                       ''   '' \
  'Back'                   BSpace 'wk-root'"

bind Space wk-root

# ---- Bare C-h/j/k/l: vim-tmux-navigator ----------------------------------
# Pass through when the pane runs (n)vim or fzf, and when there is no pane in
# that direction (so C-l still clears the shell and C-k still kills to EOL in
# a single pane, matching the kitty config's reason for leaving them unbound).
%hidden IS_VIM='#{m/r:(^|/)g?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$,#{pane_current_command}}'
bind -n C-h if -F "$IS_VIM" 'send-keys C-h' { if -F '#{pane_at_left}'   'send-keys C-h' 'select-pane -L' }
bind -n C-j if -F "$IS_VIM" 'send-keys C-j' { if -F '#{pane_at_bottom}' 'send-keys C-j' 'select-pane -D' }
bind -n C-k if -F "$IS_VIM" 'send-keys C-k' { if -F '#{pane_at_top}'    'send-keys C-k' 'select-pane -U' }
bind -n C-l if -F "$IS_VIM" 'send-keys C-l' { if -F '#{pane_at_right}'  'send-keys C-l' 'select-pane -R' }
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ---- Resize without prefix: C-M-h/j/k/l, C-M-0 reset (kitty) --------------
bind -n C-M-h resize-pane -L 5
bind -n C-M-j resize-pane -D 3
bind -n C-M-k resize-pane -U 3
bind -n C-M-l resize-pane -R 5
bind -n C-M-0 select-layout -E

# ---- Alt layer (kitty held-Tab layer) -------------------------------------
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H swap-pane -s '{left-of}'
bind -n M-J swap-pane -s '{down-of}'
bind -n M-K swap-pane -s '{up-of}'
bind -n M-L swap-pane -s '{right-of}'
bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-x confirm-before -p "close pane #P? (y/n)" kill-pane
bind -n M-z resize-pane -Z
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 last-window
bind -n M-w display-panes
bind -n M-T break-pane                   # kitty alt+shift+t: pane -> new tab
bind -n M-X choose-tree -Zw { join-pane -t "%%" }   # kitty alt+shift+x: pane -> chosen tab

# ---- Copy mode: vim selection / yank --------------------------------------
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send-keys -X copy-end-of-line-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
