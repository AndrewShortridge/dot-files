[package]
name = "ksession-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
# `buffer_unordered` for fan-out window capture (Plan §B.2). Already pulled
# in transitively by nvim-rs, but pinned explicitly so the orchestrator
# survives unrelated dep churn.
futures = "0.3"
nvim-rs = { version = "0.9", features = ["use_tokio"] }
once_cell = "1"
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "time", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
glob = "0.3"

[[bin]]
name = "scrollback_injector"
path = "src/bin/scrollback_injector.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = 1
