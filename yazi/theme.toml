# ~/.config/yazi/theme.toml
# Yazi v26.1.4
#
# Palette mirrors ~/.config/kitty/current-theme.conf (One Dark):
#   bg      #282c34  (background / color0)
#   bg+     #393e48  (color8)
#   fg      #979eab  (foreground / color7)
#   fg+     #abb2bf  (color15)
#   red     #e06c75  (color1)
#   green   #98c379  (color2)
#   yellow  #e5c07b  (color3)
#   blue    #61afef  (color4)
#   magenta #c678dd  (color5)
#   cyan    #56b6c2  (color6)
#   orange  #d19a66  (color9)

[app]
overall = { bg = "#282c34" }

[mgr]
cwd = { fg = "#61afef", bold = true }

find_keyword  = { fg = "#e5c07b", bold = true, italic = true, underline = true }
find_position = { fg = "#c678dd", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "#56b6c2", italic = true }

marker_copied   = { fg = "#61afef", bg = "#61afef" }
marker_cut      = { fg = "#e06c75", bg = "#e06c75" }
marker_marked   = { fg = "#e5c07b", bg = "#e5c07b" }
marker_selected = { fg = "#98c379", bg = "#98c379" }

count_copied   = { fg = "#282c34", bg = "#61afef" }
count_cut      = { fg = "#282c34", bg = "#e06c75" }
count_selected = { fg = "#282c34", bg = "#98c379" }

border_symbol = "│"
border_style  = { fg = "#393e48" }

syntect_theme = "~/.config/yazi/syntect/OneDarkPro.tmTheme"

# Tabs: kitty's effective active_tab_* / inactive_tab_* (kitty.conf overrides after the theme include)
[tabs]
active   = { fg = "#282c34", bg = "#56b6c2", bold = true }
inactive = { fg = "#7f848e", bg = "#16191f" }

[mode]
normal_main = { fg = "#282c34", bg = "#61afef", bold = true }
normal_alt  = { fg = "#61afef", bg = "#393e48" }
select_main = { fg = "#282c34", bg = "#e5c07b", bold = true }
select_alt  = { fg = "#e5c07b", bg = "#393e48" }
unset_main  = { fg = "#282c34", bg = "#e06c75", bold = true }
unset_alt   = { fg = "#e06c75", bg = "#393e48" }

# Hovered row: dark text on cyan, same as kitty's active tab
[indicator]
parent  = { fg = "#282c34", bg = "#56b6c2", bold = true }
current = { fg = "#282c34", bg = "#56b6c2", bold = true }
preview = { fg = "#282c34", bg = "#56b6c2", bold = true }
padding = { open = "", close = "" }

[status]
overall = { fg = "#979eab", bg = "#282c34" }

perm_sep   = { fg = "#393e48" }
perm_type  = { fg = "#98c379" }
perm_read  = { fg = "#e5c07b" }
perm_write = { fg = "#e06c75" }
perm_exec  = { fg = "#56b6c2" }

progress_label  = { fg = "#abb2bf", bold = true }
progress_normal = { fg = "#98c379", bg = "#393e48" }
progress_error  = { fg = "#e06c75", bg = "#393e48" }

[which]
mask            = { bg = "#282c34" }
cand            = { fg = "#56b6c2" }
rest            = { fg = "#979eab" }
desc            = { fg = "#c678dd" }
separator_style = { fg = "#393e48" }

[confirm]
border  = { fg = "#61afef" }
title   = { fg = "#61afef", bold = true }
btn_yes = { fg = "#282c34", bg = "#98c379", bold = true }
btn_no  = { fg = "#abb2bf" }

[spot]
border   = { fg = "#61afef" }
title    = { fg = "#61afef", bold = true }
tbl_col  = { fg = "#61afef" }
tbl_cell = { fg = "#e5c07b", reversed = true }

[notify]
title_info  = { fg = "#98c379" }
title_warn  = { fg = "#e5c07b" }
title_error = { fg = "#e06c75" }

[pick]
border = { fg = "#61afef" }
active = { fg = "#c678dd", bold = true }

[input]
border   = { fg = "#61afef" }
title    = { fg = "#abb2bf" }
value    = { fg = "#abb2bf" }
selected = { fg = "#282c34", bg = "#979eab" }

[cmp]
border = { fg = "#61afef" }
active = { fg = "#282c34", bg = "#979eab" }

[tasks]
border  = { fg = "#61afef" }
title   = { fg = "#abb2bf" }
hovered = { fg = "#c678dd", bold = true }

[help]
on      = { fg = "#56b6c2" }
run     = { fg = "#c678dd" }
desc    = { fg = "#979eab" }
hovered = { fg = "#282c34", bg = "#979eab", bold = true }
footer  = { fg = "#282c34", bg = "#979eab" }

[filetype]
rules = [
  { url = "*/",     fg = "#61afef", bold = true },

  { url = "*.py",   fg = "#61afef", bold = true },
  { url = "*.sh",   fg = "#98c379", bold = true },
  { url = "*.rs",   fg = "#e06c75", bold = true },
  { url = "*.toml", fg = "#d19a66", bold = true },

  { mime = "image/*",         fg = "#e5c07b" },
  { mime = "{audio,video}/*", fg = "#c678dd" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c678dd" },
  { mime = "application/{pdf,doc,rtf}", fg = "#56b6c2" },

  { url = "*", is = "orphan", fg = "#e06c75", crossed = true },
  { url = "*", is = "exec",   fg = "#98c379" },

  { url = "*", fg = "#abb2bf" },
]
